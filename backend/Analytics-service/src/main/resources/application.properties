# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${SERVER_PORT:8081}
spring.application.name=${SPRING_APPLICATION_NAME:analytics-service}

# ===============================
# DATABASE CONFIGURATION (MariaDB)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3309/analytics_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===============================
# GEMINI AI CONFIGURATION (FIXED)
# ===============================
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/

# Main Model (Gemini 2.5 Flash Lite)
spring.ai.openai.chat.options.model=gemini-1.5-flash

# Options
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=1000

# ===============================
# FEIGN CONFIGURATION (TIMEOUT FIX)
# ===============================
feign.client.config.default.connect-timeout=10000
feign.client.config.default.read-timeout=10000

# ===============================
# KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ===============================
# INTERNAL SERVICES
# ===============================
app.services.event-service.url=${APP_SERVICES_EVENT_SERVICE_URL}
app.services.lucky-draw-service.url=${APP_SERVICES_LUCKY_DRAW_SERVICE_URL}

# ===============================
# LOCAL AI CONFIGURATION (FALLBACK)
# ===============================
app.ai.local-url=${LOCAL_AI_URL}

# ===============================
# JACKSON CONFIGURATION (Timezone)
# ===============================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
