name: Backend CI/CD Deploy

on:
  push:
    branches:
      - deploy-openvnp

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Backend CI
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - Identity-service
          - Event-service
          - Notification-service
          - Lucky-draw-service
          - Analytics-service
          - AI-Event-Management

    steps:
      - name: Checkout backend source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile and package service
        working-directory: backend/${{ matrix.service }}
        run: |
          if [ -f ./pom.xml ]; then
            if [ -f ./mvnw ]; then
              chmod +x ./mvnw
              ./mvnw -DskipTests package
            else
              mvn -DskipTests package
            fi
          elif [ -f ./package.json ]; then
            echo "Node.js service, skipping Maven compilation."
          else
            echo "Unknown service type, skipping compilation."
          fi

      - name: Build service Docker image
        working-directory: backend/${{ matrix.service }}
        run: |
          IMAGE_NAME=$(echo "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE_NAME:ci" .

  compose-check:
    name: Docker Compose config check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend source
        uses: actions/checkout@v4

      - name: Create dummy env files
        working-directory: backend
        run: |
          touch AI-Event-Management/.env
          touch Analytics-service/.env
          touch Event-service/.env
          touch Identity-service/.env
          touch Lucky-draw-service/.env
          touch Notification-service/.env

      - name: Validate docker-compose.yml
        working-directory: backend
        run: docker compose config

  deploy:
    name: Deploy backend to DigitalOcean
    runs-on: ubuntu-latest
    needs:
      - ci
      - compose-check

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy backend on server
        run: |
          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}" '
            set -e

            cd "${{ secrets.BACKEND_PATH }}"
            git fetch origin
            git checkout deploy-openvnp
            git pull --ff-only origin deploy-openvnp

            # Navigate to the backend directory where docker-compose.yml is located
            cd backend
            docker compose up -d --build

            echo "${GITHUB_SHA:-unknown}" > /opt/event-management-backend-version.txt
          '

      - name: Wait for backend services
        run: sleep 25

      - name: Smoke test API gateway
        run: curl -i "${{ secrets.API_URL }}"

      - name: Smoke test identity route
        run: curl -i "${{ secrets.API_URL }}/identity"
