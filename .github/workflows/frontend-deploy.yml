name: Frontend CI/CD Deploy

on:
  push:
    branches:
      - deploy-openvnp

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/event-management-portal-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/event-management-portal-web
        run: npm ci

      - name: Build frontend production
        working-directory: frontend/event-management-portal-web
        run: npm run build

      - name: Build frontend Docker image
        working-directory: frontend/event-management-portal-web
        run: docker build -t event-management-frontend:ci .

  deploy:
    name: Deploy frontend to DigitalOcean
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Create release version
        id: version
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy frontend on server
        run: |
          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}" '
            set -e

            cd "${{ secrets.FRONTEND_PATH }}"
            git fetch origin
            git checkout deploy-openvnp
            git pull --ff-only origin deploy-openvnp

            # Navigate to actual frontend directory
            cd frontend/event-management-portal-web

            docker inspect event-management-frontend --format="{{.Config.Image}}" > /opt/event-management-frontend-previous-image.txt 2>/dev/null || true

            docker build -t event-management-frontend:${{ steps.version.outputs.tag }} .
            docker tag event-management-frontend:${{ steps.version.outputs.tag }} event-management-frontend:latest

            docker rm -f event-management-frontend || true
            docker run -d \
              --name event-management-frontend \
              --restart always \
              --env-file .env \
              -p 80:80 \
              event-management-frontend:${{ steps.version.outputs.tag }}

            echo "${{ steps.version.outputs.tag }}" > /opt/event-management-frontend-version.txt

            CURRENT_IMAGE="event-management-frontend:${{ steps.version.outputs.tag }}"
            PREVIOUS_IMAGE="$(cat /opt/event-management-frontend-previous-image.txt 2>/dev/null || true)"

            echo "Current frontend image: $CURRENT_IMAGE"
            echo "Previous frontend image: $PREVIOUS_IMAGE"

            docker images "event-management-frontend" --format "{{.Repository}}:{{.Tag}}" \
              | grep -v "^event-management-frontend:latest$" \
              | grep -v "^${CURRENT_IMAGE}$" \
              | grep -v "^${PREVIOUS_IMAGE}$" \
              | xargs -r docker rmi || true

            docker image prune -f
            docker builder prune -f
          '

      - name: Wait for frontend
        run: sleep 15

      - name: Smoke test frontend
        run: curl -f -I "${{ secrets.APP_URL }}"
