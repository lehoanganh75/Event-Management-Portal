# ===============================================================
# SERVER & APPLICATION CONFIGURATION
# ===============================================================
server.port=${PORT}
spring.application.name=${SPRING_APPLICATION_NAME}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
# Tăng cường hiệu năng Server để tránh lỗi 502 khi AI đang xử lý nặng
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# ===============================================================
# MULTIPART CONFIGURATION (File Upload Size)
# ===============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================================================
# DATABASE CONFIGURATION (MariaDB)
# ===============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10

# ===============================================================
# JPA / HIBERNATE CONFIGURATION
# ===============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
# Data seeding from data.sql


spring.jackson.deserialization.fail-on-null-for-primitives=false

# ===============================================================
# SECURITY & JWT CONFIGURATION
# ===============================================================
jwt.secret=${JWT_SECRET:ouhPBmsFWNGn1/QKWEsm/2WMB4CAt4yFGv/3qYaWD4xa5DmoBD/ACvY3oVcBZmsVLl03mVuRLJ9QsKoA3Q0osg==}

# ===============================================================
# KAFKA CONFIGURATION
# ===============================================================
spring.kafka.producer.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=ERROR

spring.kafka.consumer.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${SPRING_KAFKA_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ================== EMAIL CONFIGURATION ==================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================================================
# REDIS CONFIGURATION
# ===============================================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

# ===============================================================
# LOGGING CONFIGURATION
# ===============================================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO
spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# GEMINI AI CONFIGURATION (VIA OPENAI STARTER)
# ===============================
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0.4
spring.ai.openai.chat.options.max-tokens=4096

# ===============================
# EMBEDDING CONFIGURATION
# ===============================
spring.ai.openai.embedding.enabled=false
spring.ai.openai.embedding.options.model=text-embedding-004
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1000ms



# ===============================================================
# MONGODB CONFIGURATION (Vector Store)
# ===============================================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}


# =================================================================
# S3 CONFIGURATION
# =================================================================
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}
aws.s3.region=${AWS_S3_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# ===============================================================
# FRONTEND CONFIGURATION
# ===============================================================
app.frontend.base-url=${FRONTEND_BASE_URL}
app.gateway.url=${GATEWAY_URL}

# ===============================================================
# LOCAL AI CONFIGURATION (FALLBACK)
# ===============================================================
app.ai.local-url=${LOCAL_AI_URL}

# ===============================================================
# JACKSON CONFIGURATION (Timezone)
# ===============================================================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
