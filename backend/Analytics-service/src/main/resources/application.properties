# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=
spring.application.name=

# ===============================
# DATABASE CONFIGURATION (MariaDB)
# ===============================
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===============================
# GEMINI AI CONFIGURATION (FIXED)
# ===============================
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/

# Main Model (Gemini 2.5 Flash Lite)
spring.ai.openai.chat.options.model=gemini-2.5-flash

# Options
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=1000

# ===============================
# KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=
spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ===============================
# INTERNAL SERVICES
# ===============================
app.services.event-service.url=
app.services.lucky-draw-service.url=
