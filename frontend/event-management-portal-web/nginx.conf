server {
    listen 80;
    
    # Enable gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Root directory where the static files are served
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    location / {
        # This is the important part: it tries to find a file matching the URI,
        # then a directory, and if neither exists, it serves index.html.
        # This ensures React Router (client-side routing) handles the 404s instead of Nginx.
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Custom 404/50x error pages (optional, since React Router handles 404)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
