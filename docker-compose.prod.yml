version: '3.8'

services:
  # DATABASE & INFRASTRUCTURE
  mariadb:
    image: mariadb:11
    container_name: mariadb-server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - micro-network

  mongodb:
    image: mongo:7
    container_name: mongodb-server
    restart: always
    ports:
      - "27020:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - micro-network

  redis:
    image: redis:7-alpine
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    networks:
      - micro-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-server
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks:
      - micro-network

  # MICROSERVICES
  analytics-service:
    build: ./backend/Analytics-service
    container_name: analytics-service
    restart: always
    environment: 
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/analytics_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mariadb
      - kafka
    networks:
      - micro-network

  event-service:
    build: ./backend/Event-service
    container_name: event-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/event_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      IDENTITY_SERVICE_URL: http://identity-service:8083
      LUCKY_DRAW_SERVICE_URL: http://lucky-draw-service:8084
    depends_on:
      - mariadb
      - kafka
      - redis
    networks:
      - micro-network

  identity-service:
    build: ./backend/Identity-service
    container_name: identity-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/identity_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mariadb
    networks:
      - micro-network

  lucky-draw-service:
    build: ./backend/Lucky-draw-service
    container_name: lucky-draw-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/lucky_draw_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mariadb
    networks:
      - micro-network

  notification-service:
    build: ./backend/Notification-service
    container_name: notification-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/notification_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mariadb
      - kafka
    networks:
      - micro-network

  # GATEWAY
  kong:
    image: kong:3.6
    container_name: kong-server
    restart: always
    ports:
      - "8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
    volumes:
      - ./backend/kong/kong.yml:/kong/kong.yml
    depends_on:
      - analytics-service
      - event-service
      - identity-service
      - lucky-draw-service
      - notification-service
    networks:
      - micro-network

  # FRONTEND
  frontend:
    build: ./frontend/event-management-portal-web
    container_name: event-management-frontend
    ports:
      - "3000:80"
    restart: always
    networks:
      - micro-network

  # CLOUDFLARE TUNNEL
  # Sau khi có token, bạn hãy thay thế [YOUR_TOKEN] ở dưới
